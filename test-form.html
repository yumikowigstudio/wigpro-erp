<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ฟอร์มทดสอบระบบ WigPro ERP</title>
<style>
  :root { --pink:#e879a0; --pink2:#f472b6; --bg:#fdf6fa; --line:#f0e0ea; --muted:#9a8a92; }
  * { box-sizing:border-box; }
  body { font-family:'Sarabun','Segoe UI',sans-serif; background:var(--bg); color:#3a2a34; margin:0; padding:0 12px 60px; }
  header { position:sticky; top:0; background:linear-gradient(135deg,var(--pink2),var(--pink)); color:#fff; margin:0 -12px 16px; padding:18px 16px; box-shadow:0 2px 12px rgba(232,121,160,.3); z-index:10; }
  h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.9; }
  .wrap { max-width:820px; margin:0 auto; }
  .meta { display:flex; gap:10px; flex-wrap:wrap; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:16px; }
  .meta label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px; }
  .meta input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-size:14px; font-family:inherit; }
  .meta > div { flex:1; min-width:160px; }
  .group { background:#fff; border:1px solid var(--line); border-radius:16px; margin-bottom:14px; overflow:hidden; }
  .group > h2 { margin:0; font-size:15px; padding:12px 16px; background:#fce9f2; color:#c2477a; }
  .case { padding:14px 16px; border-top:1px solid var(--line); }
  .case:first-of-type { border-top:none; }
  .case .step { font-weight:600; font-size:14px; margin-bottom:2px; }
  .case .exp { font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  .opts { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .opts label { font-size:13px; padding:6px 12px; border:1px solid var(--line); border-radius:20px; cursor:pointer; user-select:none; background:#faf4f8; }
  .opts input { display:none; }
  .opts input:checked + span { font-weight:700; }
  .opts label:has(input[value=pass]:checked) { background:#e6f7ec; border-color:#8ed6a5; color:#1b7a3f; }
  .opts label:has(input[value=fail]:checked) { background:#fde8e8; border-color:#eaa; color:#c0392b; }
  .opts label:has(input[value=block]:checked){ background:#fff4e0; border-color:#f0c674; color:#a06a1b; }
  .case textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-size:13px; font-family:inherit; resize:vertical; min-height:38px; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:12px; display:flex; gap:10px; justify-content:center; box-shadow:0 -2px 12px rgba(0,0,0,.06); }
  .bar button { padding:11px 18px; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .primary { background:linear-gradient(135deg,var(--pink2),var(--pink)); color:#fff; }
  .ghost { background:#f4e8f0; color:#c2477a; }
  .count { font-size:12px; color:var(--muted); text-align:center; margin:6px 0 14px; }
  .note { background:#fff8e0; border:1px solid #f0d890; border-radius:12px; padding:10px 14px; font-size:12.5px; margin-bottom:16px; }
</style>
</head>
<body>
<header><div class="wrap"><h1>🧪 ฟอร์มทดสอบระบบ WigPro ERP</h1><p>ทำตามขั้นตอน แล้วเลือกผล ✅ ผ่าน / ❌ ไม่ผ่าน / ⚠️ ติดปัญหา · กรอกหมายเหตุถ้าเจอบั๊ก</p></div></header>
<div class="wrap">
  <div class="note">📌 เปิดระบบที่ลิงก์ที่ได้รับ → login ก่อนเริ่มทดสอบ · ระบบจะจำผลไว้ในเครื่องอัตโนมัติ · เสร็จแล้วกด "คัดลอกผล" หรือ "ดาวน์โหลด" ส่งกลับให้ผู้ดูแล</div>

  <div class="meta">
    <div><label>ชื่อผู้ทดสอบ</label><input id="tester" placeholder="ชื่อ" /></div>
    <div><label>วันที่ทดสอบ</label><input id="tdate" type="date" /></div>
    <div><label>อุปกรณ์/เบราว์เซอร์</label><input id="device" placeholder="เช่น มือถือ Chrome / คอม Edge" /></div>
  </div>

  <div id="cases"></div>
  <div class="count" id="count"></div>
</div>

<div class="bar">
  <button class="ghost" onclick="copyResults()">📋 คัดลอกผล</button>
  <button class="primary" onclick="downloadResults()">⬇️ ดาวน์โหลดผล</button>
  <button class="ghost" onclick="clearAll()">🗑️ ล้าง</button>
</div>

<script>
const TESTS = [
  ["เฟส A — ความเสถียร/ความเร็ว", [
    ["สลับหน้าไปมาหลายเมนู", "แต่ละหน้าโหลดเร็ว ไม่หมุนรอนานทุกครั้ง"],
    ["เพิ่มลูกค้าใหม่ แล้วรีเฟรชหน้า (F5)", "ลูกค้ายังอยู่ในรายการ ไม่หายไป"],
    ["ดูมุมขวาล่างของจอ", "ไม่มีกล่อง Error สีแดง (Issues)"],
  ]],
  ["เฟส B — งานขาย + คอมมิชชั่น", [
    ["ตั้งค่า → พนักงาน: เพิ่มพนักงาน + ใส่ % คอม", "บันทึกได้ พนักงานขึ้นในรายการ"],
    ["POS: หยิบสินค้าลงตะกร้า แล้วเลือก 'ผู้ขาย' ใต้รายการ", "มีตัวเลข 'คอม xxx' ขึ้นข้างรายการ"],
    ["POS: กดขาย แล้วรีเฟรช", "ยอดขายถูกบันทึก ไม่หาย + ออกใบเสร็จ"],
    ["เมนู คอมมิชชั่น", "ยอดคอมของพนักงานที่เลือกขึ้นถูกต้อง"],
  ]],
  ["เฟส B — มัดจำ + สลิป", [
    ["POS โหมดมัดจำ: รับมัดจำ (เลือกลูกค้าด้วย)", "บันทึกได้ + ออกใบมัดจำ"],
    ["POS โหมดขาย: เลือกลูกค้าคนเดิม → ติ๊ก 'หักมัดจำเดิม'", "ยอดชำระสุทธิลดลงตามมัดจำ"],
    ["POS: เลือกจ่าย 'โอนเงิน' → กด 'แนบสลิป' → อัปรูป", "อัปโหลดรูปสลิปได้"],
  ]],
  ["เฟส C — เอกสาร + รายงาน", [
    ["เมนู ใบเสนอราคา → สร้าง → กดพิมพ์ 🖨️", "ใบ A4 มีชื่อร้าน/ที่อยู่/รายการ/ยอดรวม"],
    ["เมนู รายงาน → แท็บ สินค้า และ คอมมิชชั่น", "มีข้อมูล/ตารางแสดง"],
    ["เมนู รายงาน → ปุ่ม Export CSV", "ดาวน์โหลดไฟล์ได้ เปิด Excel ภาษาไทยอ่านออก"],
    ["เมนู บัญชี → ปุ่ม Export CSV", "ดาวน์โหลดไฟล์รายรับรายจ่ายได้"],
  ]],
  ["เฟส C — คูปอง + คืนสินค้า", [
    ["ตั้งค่า → คูปองส่วนลด → สร้าง TEST10 (ลด 10%)", "คูปองขึ้นในรายการ"],
    ["POS: ใส่รหัส TEST10 → กด 'ใช้'", "ส่วนลด 10% เข้า + ขึ้น 'ใช้คูปอง TEST10'"],
    ["ขายสินค้า (จำเลข RCP-...) → เมนู คืน/เปลี่ยนสินค้า → ใส่เลขบิล → เลือกจำนวนคืน → ยืนยัน", "คืนสำเร็จ + สต๊อกสินค้าเพิ่มกลับ"],
  ]],
  ["เฟส C — บันทึกผลบริการ", [
    ["ลูกค้า → เลือกคน → แท็บ 'ผลบริการ' → บันทึกผลบริการ + อัปรูปก่อน/หลัง", "บันทึกได้ + แสดงในรายการพร้อมรูป"],
  ]],
  ["Google Calendar", [
    ["นัดหมายใหม่ + เปิด toggle Sync → บันทึก", "ขึ้น event ในปฏิทิน Google ของร้าน"],
  ]],
];

let idx = 0;
const casesEl = document.getElementById('cases');
TESTS.forEach(([group, items]) => {
  const g = document.createElement('div'); g.className = 'group';
  g.innerHTML = `<h2>${group}</h2>`;
  items.forEach(([step, exp]) => {
    const id = 'c' + idx++;
    const div = document.createElement('div'); div.className = 'case';
    div.innerHTML = `
      <div class="step">${id.slice(1)*1+1}. ${step}</div>
      <div class="exp">คาดหวัง: ${exp}</div>
      <div class="opts">
        <label><input type="radio" name="${id}" value="pass" onchange="save()"><span>✅ ผ่าน</span></label>
        <label><input type="radio" name="${id}" value="fail" onchange="save()"><span>❌ ไม่ผ่าน</span></label>
        <label><input type="radio" name="${id}" value="block" onchange="save()"><span>⚠️ ติดปัญหา</span></label>
      </div>
      <textarea id="${id}_n" placeholder="หมายเหตุ / บั๊กที่เจอ (ถ้ามี)" oninput="save()"></textarea>`;
    div.dataset.step = step; div.dataset.group = group; div.dataset.id = id;
    g.appendChild(div);
  });
  casesEl.appendChild(g);
});

const KEY = 'wigpro_test_v1';
function collect() {
  const data = { tester:val('tester'), tdate:val('tdate'), device:val('device'), results:[] };
  document.querySelectorAll('.case').forEach(c => {
    const id = c.dataset.id;
    const sel = document.querySelector(`input[name="${id}"]:checked`);
    data.results.push({ group:c.dataset.group, step:c.dataset.step, result:sel?sel.value:'', note:document.getElementById(id+'_n').value });
  });
  return data;
}
function val(id){ return document.getElementById(id).value; }
function save(){ localStorage.setItem(KEY, JSON.stringify(collect())); updateCount(); }
function updateCount(){
  const d = collect(); const total = d.results.length;
  const done = d.results.filter(r=>r.result).length;
  const pass = d.results.filter(r=>r.result==='pass').length;
  const fail = d.results.filter(r=>r.result==='fail').length;
  document.getElementById('count').textContent = `ทำแล้ว ${done}/${total} · ผ่าน ${pass} · ไม่ผ่าน ${fail}`;
}
function load(){
  const raw = localStorage.getItem(KEY); if(!raw) { updateCount(); return; }
  try {
    const d = JSON.parse(raw);
    ['tester','tdate','device'].forEach(k=>{ if(d[k]) document.getElementById(k).value=d[k]; });
    d.results.forEach((r,i)=>{
      const id='c'+i;
      if(r.result){ const el=document.querySelector(`input[name="${id}"][value="${r.result}"]`); if(el) el.checked=true; }
      const n=document.getElementById(id+'_n'); if(n&&r.note) n.value=r.note;
    });
  } catch(e){}
  updateCount();
}
function toText(){
  const d = collect();
  const map={pass:'ผ่าน',fail:'ไม่ผ่าน',block:'ติดปัญหา','':'-'};
  let s = `ผลทดสอบ WigPro ERP\nผู้ทดสอบ: ${d.tester||'-'} | วันที่: ${d.tdate||'-'} | อุปกรณ์: ${d.device||'-'}\n\n`;
  let g='';
  d.results.forEach(r=>{ if(r.group!==g){ s+=`\n【${r.group}】\n`; g=r.group; } s+=`[${map[r.result]}] ${r.step}${r.note?'  — '+r.note:''}\n`; });
  const fail=d.results.filter(r=>r.result==='fail'||r.result==='block');
  if(fail.length){ s+=`\n⚠️ ที่ต้องแก้ (${fail.length}):\n`; fail.forEach(r=>s+=`- ${r.step}: ${r.note||'(ไม่มีหมายเหตุ)'}\n`); }
  return s;
}
function copyResults(){ navigator.clipboard.writeText(toText()).then(()=>alert('คัดลอกผลแล้ว! วางในแชท/LINE ส่งให้ผู้ดูแลได้เลย')).catch(()=>alert('คัดลอกไม่สำเร็จ ลองใช้ปุ่มดาวน์โหลดแทน')); }
function downloadResults(){
  const d=collect();
  const blob=new Blob(['﻿'+toText()],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`ผลทดสอบ-${d.tester||'tester'}-${d.tdate||''}.txt`; a.click();
}
function clearAll(){ if(confirm('ล้างผลทั้งหมด?')){ localStorage.removeItem(KEY); location.reload(); } }
document.getElementById('tdate').value = new Date().toISOString().slice(0,10);
load();
</script>
</body>
</html>
